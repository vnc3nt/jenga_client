<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Gewinnt</title>
    <script language="javascript" type="text/javascript" src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body onload="initializeTime()">
    <h1>4 Gewinnt</h1>

    <div id="espIp" style="position: fixed; top: 5px; right: 10px; color: lightgrey; font-size: 0.8em;">-</div>
    
    <button id="toggle-dark-mode" onclick="toggleDarkMode()"><img src="img/sun-moon.png" alt="Dark Mode"></button>


    <div id="chartContainer">
        <div id="analysisPlayer1" class="analysis">
            <div id="usedTime1" class="analysisUsedTime">-</div><br>
            <div id="stats">
                <ul>
                    <li style="font-weight: bold;">
                        ø
                    </li>
                    <li>
                        <div id="averageTime1" class="analysisAverageTime">-</div>
                    </li>
                </ul>
                <ul>
                    <li style="font-weight: bold;">
                        Züge
                    </li>
                    <li>
                        <div id="counts1" class="count">-</div>
                    </li> 
                </ul>
            </div><br><br>
             <div id="timeList1" class="timeList"></div>
            <br>
        </div>

        <div id="barPlayer1" class="bar"><div class="players">1</div><span class="times" id="time_player_1"></span></div>
        <div id="barPlayer2" class="bar"><div class="players">2</div><span class="times" id="time_player_2"></span></div>

        
        <div id="analysisPlayer2" class="analysis">
            <div id="usedTime2" class="analysisUsedTime">-</div><br>
            <div id="stats">
                <ul>
                    <li style="font-weight: bold;">
                        ø
                    </li>
                    <li>
                        <div id="averageTime2" class="analysisAverageTime">-</div>
                    </li>
                </ul>
                <ul>
                    <li style="font-weight: bold;">
                        Züge
                    </li>
                    <li>
                        <div id="counts2" class="count">-</div>
                    </li> 
                </ul>
            </div><br><br>
             <div id="timeList2" class="timeList"></div>
        </div>
    </div>


    <div id="timeOutMessage">Zeit zu Ende</div>
    <div id="timeOutWinner"></div>
    <div id="timeOutBackground"></div>

</body>
</html>
